name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: lint + test (no install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Nothing to install: node: builtins only. An install step here would be
      # a step that can quietly succeed at nothing.
      - run: npm run lint
      - run: npm test
